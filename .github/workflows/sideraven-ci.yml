name: Sideraven CI

on:
  push:
    branches:
      - sideraven
      - main
  pull_request:
    branches:
      - sideraven
      - main
  workflow_dispatch:

# One run at a time per branch; only the latest waiting push is kept (saves private-repo minutes).
concurrency:
  group: sideraven-ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    timeout-minutes: 240
    name: Build debug APK and run Sideraven unit tests
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: 'true'
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          java-version: 17
          distribution: temurin

      # Private runners have 8 GB RAM and a 14 GB disk; Fenix needs more of both. Free the disk by
      # removing preinstalled toolchains we don't use (our Android SDK is installed separately),
      # then add swap on the temp disk (a run died of memory starvation, another of a full disk).
      - name: Free disk space and add swap
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h / /mnt || true
          SWAP_DIR=$( [ -d /mnt ] && [ -w /mnt ] || sudo test -d /mnt && echo /mnt || echo / )
          sudo fallocate -l 6G $SWAP_DIR/sideraven-swap
          sudo chmod 600 $SWAP_DIR/sideraven-swap
          sudo mkswap $SWAP_DIR/sideraven-swap
          sudo swapon $SWAP_DIR/sideraven-swap
          free -h

      - name: Release strings say Sideraven
        run: ./automation/sideraven/test-brand-strings.sh

      - name: Install Android SDK with pieces Gradle skips
        run: ./automation/iceraven/install-sdk.sh

      - name: Prepare checkout
        run: ./automation/sideraven/prepare.sh --force

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build forkDebug
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs="-XX:MaxMetaspaceSize=1g -Xms1g -Xmx5g" -Dorg.gradle.workers.max=2
        run: ./gradlew app:assembleForkDebug -Pkotlin.compiler.execution.strategy=in-process --stacktrace --no-daemon

      - name: Sideraven unit tests
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs="-XX:MaxMetaspaceSize=1g -Xms1g -Xmx5g" -Dorg.gradle.workers.max=2
        run: ./gradlew -PtestBuildType=forkDebug -PsideravenTests -Pkotlin.compiler.execution.strategy=in-process app:testForkDebugUnitTest --tests 'pt.dweep.sideraven.*' --no-daemon

      # Private repos: 2 CPU / 8 GB runners, ~2,000 min and 500 MB storage per month.
      - name: Upload arm64 debug APK
        uses: actions/upload-artifact@v7
        with:
          name: sideraven-debug-arm64
          path: gradle/build/app/outputs/apk/forkDebug/*arm64-v8a*.apk
          retention-days: 3
